name: Release @penumbrafi packages

# Publishes ONLY @penumbrafi/{types,wasm,services} (scripts/publish-penumbrafi.sh), with npm
# provenance. Upstream @penumbra-zone/* workspace packages are never published from here.
#
# Flow (changesets):
#   push to main with pending .changeset/*.md -> job `version` opens/updates the
#     "Version @penumbrafi packages" PR (no build, no publish)
#   merge of that PR (no changesets left)     -> job `publish` builds serial + parallel wasm,
#     verifies the parallel blob, publishes any @penumbrafi version not yet on npm, tags + releases
#
# Secrets: NPM_TOKEN (granular npm token, read+write on @penumbrafi/*, bypass 2FA for automation).

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version PR
    if: github.repository == 'penumbrafi/web' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # No `publish` input: this job only ever creates/updates the version PR.
      - name: Create or update version PR
        id: changesets
        uses: changesets/action@v1
        with:
          title: 'Version @penumbrafi packages'
          commit: 'chore(release): version @penumbrafi packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Build + publish
    needs: version
    if: needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 120 # fat-LTO parallel wasm + serial wasm from a cold cargo cache
    environment: npm
    permissions:
      contents: write # tags + GitHub releases
      id-token: write # npm provenance (sigstore via GitHub OIDC)
    env:
      TURBO_TELEMETRY_DISABLED: 1
      NPM_CONFIG_PROVENANCE: true
      # Pinned to what the parallel build was validated with. Must equal the
      # wasm-bindgen crate version in packages/wasm/crate/Cargo.lock.
      RUST_TOOLCHAIN: '1.83'
      WASM_BINDGEN_VERSION: '0.2.106'
      WASM_PACK_VERSION: '0.13.1'
      BINARYEN_VERSION: '117'
      BINARYEN_SHA256: 3dc677006555b355ea2da5e82602065a161d5e83eaefd3f759afa00b96e83212
    steps:
      - uses: actions/checkout@v5

      - name: Anything to publish?
        id: pending
        run: |
          pending=0
          for d in packages/types packages/wasm packages/services; do
            n=$(jq -r .name $d/package.json); v=$(jq -r .version $d/package.json)
            if npm view "$n@$v" version >/dev/null 2>&1; then echo "$n@$v already published"
            else echo "$n@$v NOT published"; pending=1; fi
          done
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.pending.outputs.pending == '1'
      - uses: actions/setup-node@v4
        if: steps.pending.outputs.pending == '1'
        with:
          node-version: 22 # npm 10: provenance support
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Rust toolchain (pinned, + rust-src for -Z build-std)
        if: steps.pending.outputs.pending == '1'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --target wasm32-unknown-unknown --component rust-src
          rustup run "$RUST_TOOLCHAIN" rustc --version

      - name: wasm-pack + wasm-bindgen-cli
        if: steps.pending.outputs.pending == '1'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }},wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}

      - name: binaryen (wasm-opt, wasm-dis)
        if: steps.pending.outputs.pending == '1'
        run: |
          set -euo pipefail
          lock_bindgen=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = |"/,""); print; exit}' packages/wasm/crate/Cargo.lock)
          [ "$lock_bindgen" = "$WASM_BINDGEN_VERSION" ] || { echo "Cargo.lock wasm-bindgen $lock_bindgen != $WASM_BINDGEN_VERSION"; exit 1; }
          tgz="binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tgz" \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/$tgz"
          echo "$BINARYEN_SHA256  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install
        if: steps.pending.outputs.pending == '1'
        run: pnpm install --frozen-lockfile

      # Parallel first: packages/wasm/src dynamically imports ../wasm-parallel, so tsc needs it.
      - name: Compile parallel (rayon) wasm
        if: steps.pending.outputs.pending == '1'
        run: |
          wasm-opt --version
          TOOLCHAIN="$RUST_TOOLCHAIN" pnpm --filter @penumbrafi/wasm compile:parallel

      # turbo `build` depends on `compile` (serial wasm-pack), `proto` and `^keys`.
      - name: Build @penumbrafi packages (+ workspace deps)
        if: steps.pending.outputs.pending == '1'
        run: pnpm turbo build --filter "@penumbrafi/*"

      - name: Test @penumbrafi packages
        if: steps.pending.outputs.pending == '1'
        run: pnpm turbo test --filter "@penumbrafi/*"

      - name: Verify tarballs
        if: steps.pending.outputs.pending == '1'
        run: |
          bash packages/wasm/crate/scripts/verify-wasm-parallel.sh
          for d in packages/types packages/wasm packages/services; do (cd $d && npm pack --dry-run); done

      - name: Publish + tag + release
        if: steps.pending.outputs.pending == '1'
        uses: changesets/action@v1
        with:
          publish: bash scripts/publish-penumbrafi.sh
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
