name: 'Setup Nix Environment'
description: 'Installs Nix and configures the cache'
inputs:
  primary-key:
    description: Primary key for the cache
    required: false
    default: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
  restore-prefix:
    description: Restore prefix for the cache
    required: false
    default: nix-${{ runner.os }}-
  backend:
    description: Backend to use for caching
    required: false
    default: actions
  save-cache:
    description: >
      Whether to save the nix-store cache after the build. Set to 'false'
      for untrusted PR builds so an attacker-controlled build cannot poison
      the branch-scoped cache that trusted builds restore from.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: nixbuild/nix-quick-install-action@v30

    # Trusted path: restore + save. Cache-nix-action's post step writes the
    # store back into the cache scope after the job.
    - name: Setup Nix Cache (with save)
      if: ${{ inputs.save-cache == 'true' }}
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: ${{ inputs.primary-key }}
        restore-prefixes-first-match: ${{ inputs.restore-prefix }}
        backend: ${{ inputs.backend }}

    # Untrusted path: restore only. Sets `save: false` so cache-nix-action
    # skips its post-job save, meaning nothing this job produces ever lands
    # in the shared branch cache.
    - name: Setup Nix Cache (restore only)
      if: ${{ inputs.save-cache != 'true' }}
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: ${{ inputs.primary-key }}
        restore-prefixes-first-match: ${{ inputs.restore-prefix }}
        backend: ${{ inputs.backend }}
        save: false

    - name: Pre-build development shell
      shell: bash
      run: |
        nix develop --command echo "devshell built and cached"
