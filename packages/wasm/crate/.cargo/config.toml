# WASM build configuration for penumbra-wasm.
#
# The package's module is built with scripts/build-wasm.sh (`pnpm build:wasm`),
# which adds atomics, bulk memory and the shared-memory maximum. A plain
# `cargo build --target wasm32-unknown-unknown` (as `wasm-pack test` does)
# gives a module without threads: fine for tests, never published.

[target.wasm32-unknown-unknown]
# Enable SIMD 128-bit for vectorized cryptographic operations
rustflags = ["-C", "target-feature=+simd128"]

# For local development with native target (optional)
# Uncomment to enable native SIMD on x86_64
# [target.x86_64-unknown-linux-gnu]
# rustflags = ["-C", "target-cpu=native"]
